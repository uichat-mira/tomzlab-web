name: Site and Folio checks
on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    name: T2 Static and Folio Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: c012ea6d1d995dd1c18c75855b7e9a4a8e8d1b74
          path: _folio_source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked consumer dependencies
        run: npm ci --no-audit --no-fund
      - name: Build pinned Folio dev candidate
        run: |
          cd _folio_source
          npm ci --no-audit --no-fund
          npm pack --workspace @uichat-mira/folio --pack-destination "$RUNNER_TEMP"
      - name: Overlay exact Folio candidate (test-only)
        run: npm install --no-save --package-lock=false --no-audit --no-fund "$RUNNER_TEMP/uichat-mira-folio-0.1.1.tgz"
      - name: Strict TypeScript consumer check
        run: npm run typecheck
      - name: Build exact site candidate
        run: npm run build
      - name: Verify legacy navigation and link contracts
        run: python3 scripts/check_site.py
  mira-gate:
    name: Mira Gate
    if: ${{ always() }}
    needs: [site-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require required checks
        env:
          CHECK_RESULT: ${{ needs.site-check.result }}
        run: test "$CHECK_RESULT" = "success"
