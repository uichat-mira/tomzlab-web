name: Static site checks
on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    name: T2 Static Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: python3 scripts/check_site.py
  mira-gate:
    name: Mira Gate
    if: ${{ always() }}
    needs: [site-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require required checks
        env:
          CHECK_RESULT: ${{ needs.site-check.result }}
        run: test "$CHECK_RESULT" = "success"
