name: Site and Folio checks
on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    name: T2 Static and Folio Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked consumer dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript consumer check
        run: npm run typecheck
      - name: Build exact site candidate
        run: npm run build
      - name: Verify legacy navigation and link contracts
        run: python3 scripts/check_site.py
  mira-gate:
    name: Mira Gate
    if: ${{ always() }}
    needs: [site-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require required checks
        env:
          CHECK_RESULT: ${{ needs.site-check.result }}
        run: test "$CHECK_RESULT" = "success"
