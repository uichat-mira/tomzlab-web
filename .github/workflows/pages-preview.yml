name: GitHub Pages preview
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tomzlab-pages-preview
  cancel-in-progress: true
jobs:
  package:
    name: Package test site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Folio consumer
        run: npm ci --no-audit --no-fund
      - name: Build preview at Pages project subpath
        env:
          TOMZLAB_FOLIO_BASE: /tomzlab-web/journal/
        run: |
          npm run build
          python3 scripts/check_site.py
      - name: Mark every preview route noindex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('_site').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              indexed = '<meta name="robots" content="index,follow">'
              hidden = '<meta name="robots" content="noindex,nofollow">'
              if indexed in html:
                  html = html.replace(indexed, hidden)
              elif hidden not in html:
                  html = html.replace('<head>', '<head>\n' + hidden, 1)
              path.write_text(html, encoding='utf-8')
          Path('_site/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          Path('_site/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Publish test preview
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
