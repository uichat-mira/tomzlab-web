name: GitHub Pages preview
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tomzlab-pages-preview
  cancel-in-progress: true
jobs:
  package:
    name: Package test site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: c012ea6d1d995dd1c18c75855b7e9a4a8e8d1b74
          path: _folio_source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked consumer dependencies
        run: npm ci --no-audit --no-fund
      - name: Build pinned Folio candidate
        run: |
          cd _folio_source
          npm ci --no-audit --no-fund
          npm pack --workspace @uichat-mira/folio --pack-destination "$RUNNER_TEMP"
      - name: Overlay dev candidate (no lockfile mutation)
        run: npm install --no-save --package-lock=false --no-audit --no-fund "$RUNNER_TEMP/uichat-mira-folio-0.1.1.tgz"
      - name: Build Pages preview
        env:
          TOMZLAB_SITE_BASE: /tomzlab-web/
          TOMZLAB_PREVIEW: '1'
        run: |
          npm run typecheck
          npm run build
          python3 scripts/check_site.py
      - name: Mark every preview route noindex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('_site').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              indexed = '<meta name="robots" content="index,follow">'
              hidden = '<meta name="robots" content="noindex,nofollow">'
              if indexed in html:
                  html = html.replace(indexed, hidden)
              elif hidden not in html:
                  html = html.replace('<head>', '<head>\n' + hidden, 1)
              path.write_text(html, encoding='utf-8')
          Path('_site/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          Path('_site/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Publish test preview
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
